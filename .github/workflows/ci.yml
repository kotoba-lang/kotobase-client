name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-cljs:
    name: shadow-cljs node-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/datom-source
          # The IPatternSource contract + conformance suite that
          # kotobase.datom-source implements. Consumed as a source-path
          # (zero deps of its own). `.deps/`, not a sibling path:
          # actions/checkout refuses any path outside the workspace.
          ref: b42f6e6ff942c7f8a2856f8142ebffc13aa11098
          path: .deps/datom-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules / gitlibs
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.gitlibs
            ~/.m2
          key: ${{ runner.os }}-cljs-${{ hashFiles('package.json', 'deps.edn') }}

      - run: npm install
      - run: npm test
      - run: clojure -M:lint
